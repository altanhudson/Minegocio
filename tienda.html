<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda online</title>
<meta name="description" content="Hacé tu pedido online desde tu celular. Catálogo con precios actualizados.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tienda online">
<meta property="og:description" content="Hacé tu pedido online desde tu celular. Catálogo con precios actualizados.">

<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#ededed;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box}</style>
<script>
(function(){
  var n = new URLSearchParams(location.search).get('n') || '';
  if(/^[A-Za-z0-9]{10,64}$/.test(n)) location.replace('/?tienda&n=' + n);
  else document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('msg').textContent = 'El link de la tienda está incompleto. Pedile al negocio que te lo vuelva a enviar.';
  });
})();
</script>
</head>
<body>
<div id="msg">Abriendo la tienda…</div>
</body>
</html>
